name: CI

on:
  push:
    branches:
      - master
      - main
      - release-*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pack-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PdfiumRaster.slnx --locked-mode

      - name: Test
        run: dotnet test PdfiumRaster.slnx --configuration Release --no-restore --filter "Category!=Local"

      - name: Enforce line coverage
        if: runner.os == 'Linux'
        run: make coverage

      - name: Upload coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage-cobertura
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Read package version
        if: runner.os == 'Linux'
        id: package-version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(dotnet msbuild src/PdfiumRaster/PdfiumRaster.csproj -getProperty:PackageVersion)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Could not resolve a valid package version: $package_version" >&2
            exit 1
          fi

          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/PdfiumRaster/PdfiumRaster.csproj --configuration Release --no-restore --output artifacts

      - name: Smoke test netstandard2.1 package consumption
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          dotnet new classlib -n PdfiumRasterCompatibility -o "$tmpdir/PdfiumRasterCompatibility" --framework netstandard2.1
          cd "$tmpdir/PdfiumRasterCompatibility"
          dotnet new nugetconfig --force
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name local --configfile nuget.config
          dotnet add package PdfiumRaster --version "${{ steps.package-version.outputs.value }}"
          dotnet build --configuration Release

      - name: Smoke test package install
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          dotnet new console -n PdfiumRasterSmoke -o "$tmpdir/PdfiumRasterSmoke" --framework net10.0
          cd "$tmpdir/PdfiumRasterSmoke"
          cat > NuGet.config <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
          dotnet add package PdfiumRaster --version "${{ steps.package-version.outputs.value }}"
          cp "$GITHUB_WORKSPACE/tests/PdfiumRaster.Tests/TestAssets/axf-annotation-1.pdf" ./annotations.pdf
          cat > Program.cs <<'CS'
          using PdfiumRaster;

          PdfImageConverter.SavePng("annotations.pdf", pageNumber: 1, "page.png");

          if (!File.Exists("page.png") || new FileInfo("page.png").Length == 0)
          {
              throw new InvalidOperationException("Smoke test did not generate page.png.");
          }
          CS
          dotnet run --configuration Release
