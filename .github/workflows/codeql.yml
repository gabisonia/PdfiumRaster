name: CodeQL

on:
  push:
    branches:
      - master
      - release-*
  pull_request:
    branches:
      - master
      - release-*
  schedule:
    - cron: "17 3 * * 4"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Restore
        run: dotnet restore PdfiumRaster.slnx --locked-mode

      - name: Build
        run: dotnet build PdfiumRaster.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:csharp
