name: Documentation site
on:
  push:
    branches: [master]
    paths: ['docs/**', 'samples/README.md', 'mkdocs.yml', 'scripts/pages/**', '.github/workflows/pages*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/pages-build.yml
    with:
      upload: true

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
